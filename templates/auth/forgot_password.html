{% extends "base.html" %}

{% block title %}忘記密碼 - 威力影城{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>忘記密碼</h1>
    <p class="auth-desc">請輸入註冊時的Email，我們將寄送重設密碼連結。</p>
    <form>
      <label>電子郵件
        <input type="email" placeholder="請輸入Email">
      </label>
      <button type="submit" class="auth-btn">送出</button>
    </form>
  </div>
</section>
{% endblock %}
